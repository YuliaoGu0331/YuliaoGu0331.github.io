<style>
  /* 1. 调整所有导航链接的字体、间距和颜色 */
  .masthead__menu-item a {
    /* 使用极其接近目标主页的现代无衬线字体栈 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
    font-size: 17px !important;            /* 调大字号 */
    color: #6a7b8c !important;             /* 替换为优雅的灰蓝色 */

    font-weight: 500 !important;           /* 让字体比默认稍微饱满一点点 */
    letter-spacing: 0.2px;                 /* 微微增加字母间距 */
  }

  /* 2. 鼠标悬停时的交互效果 */
  .masthead__menu-item a:hover {
    color: #3b4a59 !important;             /* 鼠标悬停时颜色变深 */
    text-decoration: none !important;
  }

  /* 3. 模仿目标主页，将第一个导航项（Homepage）加粗并稍微调大，作为 Logo 锚点 */
  .masthead__menu-item:first-child a {
    font-weight: 700 !important;           /* 显著加粗 */
    color: #5a6c7d !important;             /* 颜色略深一点 */
    font-size: 18px !important;            /* 字号略大一点 */
  }

  /* ================= 侧边栏专属美化 ================= */
  
  /* 1. 统一侧边栏的字体，与顶部导航栏保持一致的高级感 */
  .sidebar {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
  }

  /* 2. 姓名：加粗、颜色调深 */
  .author__name {
    font-weight: 700 !important;
    color: #494e52 !important;
    margin-bottom: 15px !important;
  }

  /* 3. 个人简介 (Bio)：改为左对齐，调整行距，去掉居中 */
  .author__bio {
    text-align: left !important;
    color: #494e52 !important;
    font-size: 13.5px !important;
    line-height: 1.45 !important;
    margin-bottom: 20px !important;
    padding: 0 5px !important; /* 与下方的图标对齐 */
  }

  /* 4. 社交图标列表外框：清除多余缩进 */
  .author__urls {
    padding: 0 5px !important;
  }

  .author__urls li {
    font-size: 13.5px !important;
    color: #494e52 !important;
    margin-bottom: 5px !important; 
    display: flex !important;
    align-items: center !important;
  }

  /* 6. 超链接文字颜色 */
  .author__urls li a {
    color: #494e52 !important;
    text-decoration: none !important;
  }

  /* 7. 小图标：固定宽度，让右侧的文字能够像表格一样垂直对齐 */
  .author__urls li i {
    color: #24292e !important; /* 图标颜色更深一点 */

    text-align: center !important;
    font-size: 13.5px !important;
    margin-right: 8px !important;
  }

  /* 1. 统一正文标题字体与颜色 */
  .page__content h1, .page__content h2, .page__content h3 {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
    color: #494e52 !important;
    font-weight: 700 !important;
  }
  /* 针对正文的主标题 (H1) 进行放大和加深 */
  .page__content h1 {
    font-size: 32px !important;    /* 主标题放大 */
    color: #444444 !important;
    margin-bottom: 0.8em !important;
  }

  /* 2. 给 H2 标题（如 Principal Investigator）加上底部的浅色分割线 */
  .page__content h2 {
    border-bottom: 1px solid #eaeaea !important; /* 极浅的灰色下划线 */
    padding-bottom: 0.3em !important;
    margin-top: 2em !important;
    margin-bottom: 1em !important;
    font-size: 22px !important;
  }

  /* 3. 正文字体、行高和对齐方式调整 */
  .page__content p {
    color: #5a6570 !important;     /* 舒适的深灰蓝色正文 */

    margin-bottom: 1.5em !important;
    text-align: justify !important;/* 文本两端对齐，让段落边缘像刀切一样整齐 */
  }

  /* 4. 超链接颜色定制 */
  .page__content a {
    color: #5aa1c2 !important; 
    text-decoration: none !important;
  }
  .page__content a:hover {
    text-decoration: underline !important;
    color: #3d7a99 !important;
  }

  /* 移除原模板为“右侧目录”强制预留的大块空白空间 */
  .page {
    padding-right: 0 !important; 
  }
  
  /* 确保内部容器宽度可以舒展开来 */
  .page__inner-wrap {
    max-width: 100% !important;
  }
  
  /* 释放正文右侧边距，稍微留一点呼吸空间（比如 20px）即可 */
  .page__content {
    padding-right: 12% !important; 
  }
</style>

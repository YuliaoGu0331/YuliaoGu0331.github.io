<header class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
        <a class="site-title" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} homepage">
          <span class="site-title__mark" aria-hidden="true">YG</span>
          <span>{{ site.title }}</span>
        </a>
        <button class="site-nav__toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="primary-links">
          <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
        <ul id="primary-links" class="site-nav__links">
          {% for link in site.data.navigation.main %}
            <li class="masthead__menu-item">
              <a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</header>
